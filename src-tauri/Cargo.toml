[package]
name = "colorful-control-center"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# 桌面目标只需要 rlib（exe 直接链接本 crate）。staticlib/cdylib 供移动端使用，
# 但 cdylib 在 windows-gnu 上触发 mingw ld 的 "export ordinal too large"
# （导出表 10 万+ 符号溢出），本应用不面向移动端，不启用。
name = "colorful_control_center_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3.0.11"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.0"
log = "0.4"
fontdb = "0.23.0"
tempfile = "3.27.0"
serde = { workspace = true }
serde_json = { workspace = true }
ccc-core = { path = "../crates/ccc-core" }
nvml-wrapper = "0.13.0"
anyhow = "1.0.104"
sha2 = "0.10"
roxmltree = "0.20.0"
windows = { version = "0.62.2", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Rpc", "Win32_System_Wmi", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Performance", "Win32_System_Com", "Win32_System_EventLog", "Win32_System_Services", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Properties"] }

# profile.release 在工作区根统一配置
