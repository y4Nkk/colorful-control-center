[package]
name = "colorful-control-center"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# 桌面目标只需要 rlib（exe 直接链接本 crate）。staticlib/cdylib 供移动端使用，
# 但 cdylib 在 windows-gnu 上触发 mingw ld 的 "export ordinal too large"
# （导出表 10 万+ 符号溢出），本应用不面向移动端，不启用。
name = "colorful_control_center_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
ccc-core = { path = "../crates/ccc-core" }
nvml-wrapper = "0.13.0"
anyhow = "1.0.104"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_Registry"] }

# profile.release 在工作区根统一配置
