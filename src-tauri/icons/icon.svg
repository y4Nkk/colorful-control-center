<!--
  Colorful Control Center 应用图标唯一源文件（src-tauri/icons 全套尺寸由
  `npx tauri icon src-tauri/icons/icon.svg` 重新生成；public/favicon.svg 为其副本）。

  设计：五叶风扇转子（自定义风扇曲线 = 本产品签名能力）+ 圆形轮毂，
  单一线性光谱自左下 #0A6CF5（tokens.css 的 ccc-action 浅色主题值）经紫、粉至琥珀，
  呼应"七彩虹"品牌与 agent-switchboard 式扁平几何语言。
-->
