[workspace]
resolver = "2"
members = ["crates/ccc-core", "src-tauri"]

[workspace.package]
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 与 src-tauri 相同的体积优化
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
