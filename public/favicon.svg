<!--
  Colorful Control Center 品牌标识唯一绘图源。
  npm run generate:icons 生成 favicon 与桌面图标；npm run check:icons 检查一致性。
  双翼气流：折射、高光和缓慢流彩都裁切在翼面内，中间通道与外围保持透明。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .ccc-logo-flow { animation: ccc-logo-flow 7.6s ease-in-out infinite; }
    .ccc-logo-flow-warm { animation-delay: -2.2s; }
    @keyframes ccc-logo-flow {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(28px, -7px); }
    }
    :root[data-motion="reduce"] .ccc-logo-flow { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .ccc-logo-flow { animation: none; }
    }
    @media (forced-colors: active) {
      .ccc-logo-material { display: none; }
      .ccc-logo-contrast { display: inline; }
    }
  </style>
  <defs>
    <path id="ccc-wing" d="M12.2 68.7C22.9 41.3 48.8 23 79 22.2L107.9 21.3C112.2 21.2 114.5 25.6 111.9 29.2C99 46.9 78.9 57.2 51.2 56.2C37.4 55.7 25.7 62.8 19 72.5C15.6 77.6 10.2 74.3 12.2 68.7Z" />
    <clipPath id="ccc-wing-clip">
      <use href="#ccc-wing" />
    </clipPath>
    <linearGradient id="ccc-cool" x1="0%" y1="84%" x2="100%" y2="16%">
      <stop stop-color="#1748EF" />
      <stop offset=".43" stop-color="#6539ED" />
      <stop offset=".72" stop-color="#A937EF" />
      <stop offset="1" stop-color="#ED31A0" />
    </linearGradient>
    <linearGradient id="ccc-warm" x1="96%" y1="15%" x2="0%" y2="90%">
      <stop stop-color="#BE25B8" />
      <stop offset=".51" stop-color="#F42E62" />
      <stop offset="1" stop-color="#FF951C" />
    </linearGradient>
    <radialGradient id="ccc-cool-flow" cx=".39" cy=".36" r=".62">
      <stop stop-color="#74E3FF" stop-opacity=".52" />
      <stop offset=".54" stop-color="#B5A5FF" stop-opacity=".23" />
      <stop offset="1" stop-color="#C995FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ccc-warm-flow" cx=".43" cy=".33" r=".64">
      <stop stop-color="#FFDB93" stop-opacity=".5" />
      <stop offset=".52" stop-color="#FF91BB" stop-opacity=".23" />
      <stop offset="1" stop-color="#FF95D1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ccc-edge-depth" x1="0%" y1="0%" x2="35%" y2="100%">
      <stop offset=".2" stop-color="#240C59" stop-opacity="0" />
      <stop offset=".64" stop-color="#240C59" stop-opacity=".16" />
      <stop offset="1" stop-color="#23093B" stop-opacity=".62" />
    </linearGradient>
    <linearGradient id="ccc-chamfer" x1="0%" y1="100%" x2="95%" y2="0%">
      <stop stop-color="#CFF5FF" stop-opacity=".07" />
      <stop offset=".33" stop-color="#F8F0FF" stop-opacity=".48" />
      <stop offset=".72" stop-color="#FFE5FB" stop-opacity=".24" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".1" />
    </linearGradient>
    <linearGradient id="ccc-rim" x1="19%" y1="0%" x2="70%" y2="90%">
      <stop stop-color="#FFFFFF" stop-opacity=".88" />
      <stop offset=".35" stop-color="#E0E6FF" stop-opacity=".43" />
      <stop offset=".7" stop-color="#E6B9FF" stop-opacity=".14" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".6" />
    </linearGradient>
    <g id="ccc-glass">
      <path d="M11 76C29 54 52 43 80 40C96 38 108 30 117 23L117 76Z" fill="url(#ccc-edge-depth)" opacity=".58" />
      <path d="M12 68.6C26 40.5 49.8 26.1 80 25.4C92 25 105 23.5 113 22C105 27.3 92.6 30 80.7 30.9C51.7 33 26.5 46.8 12 68.6Z" fill="url(#ccc-chamfer)" />
      <use href="#ccc-wing" fill="none" stroke="url(#ccc-edge-depth)" stroke-width="6" />
      <use href="#ccc-wing" fill="none" stroke="url(#ccc-rim)" stroke-width="2.5" />
    </g>
  </defs>
  <g class="ccc-logo-material">
    <g clip-path="url(#ccc-wing-clip)">
      <use href="#ccc-wing" fill="url(#ccc-cool)" />
      <ellipse class="ccc-logo-flow" cx="34" cy="47" rx="50" ry="32" fill="url(#ccc-cool-flow)" />
      <use href="#ccc-glass" />
    </g>
    <g transform="rotate(180 64 64)" clip-path="url(#ccc-wing-clip)">
      <use href="#ccc-wing" fill="url(#ccc-warm)" />
      <ellipse class="ccc-logo-flow ccc-logo-flow-warm" cx="20" cy="49" rx="47" ry="31" fill="url(#ccc-warm-flow)" />
      <use href="#ccc-glass" />
    </g>
  </g>
  <g class="ccc-logo-contrast" display="none" fill="CanvasText">
    <use href="#ccc-wing" />
    <use href="#ccc-wing" transform="rotate(180 64 64)" />
  </g>
</svg>
