name: Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify source version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { '' }
          ./scripts/stage-windows-release.ps1 -Tag $tag -CheckVersionOnly

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Prepare Windows build tools
        shell: pwsh
        run: |
          $toolPaths = @('C:\mingw64\bin', (Join-Path $env:ProgramFiles '7-Zip'))
          foreach ($directory in $toolPaths) {
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "Missing Windows build tool directory: $directory"
            }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolPaths -Encoding utf8
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Build and verify installer
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/stage-windows-release.ps1

      - name: Upload installer candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installer-${{ github.run_attempt }}
          path: |
            target/github-release/ColorfulControlCenter_*_x64-setup.exe
            target/github-release/SHA256SUMS.txt
            target/github-release/release-notes.md
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="ColorfulControlCenter_${version}_x64-setup.exe"
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$installer" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md \
            --title "Colorful Control Center $version"
