name: 功能建议
description: 提议功能或改进现有界面与操作
body:
  - type: textarea
    id: goal
    attributes:
      label: 你想完成什么
      description: 可以描述使用场景和当前遇到的困难。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望怎样改进
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 补充示例或截图
